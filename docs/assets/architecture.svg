<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#53718a"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#f3f6f9"/>
  <text x="60" y="70" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="700" fill="#17202a">
    OpsKestrel: Auditable Cross-System Automation
  </text>
  <text x="60" y="104" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" fill="#65717c">
    Browser-first data collection, deterministic business rules, evidence, checkpoints, and reports
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="160" width="220" height="110" rx="16" fill="#ffffff"/>
    <rect x="330" y="160" width="220" height="110" rx="16" fill="#ffffff"/>
    <rect x="600" y="160" width="220" height="110" rx="16" fill="#ffffff"/>
    <rect x="870" y="160" width="270" height="110" rx="16" fill="#ffffff"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" text-anchor="middle">
    <text x="170" y="205" font-size="20" font-weight="650" fill="#17202a">Expected Inputs</text>
    <text x="170" y="237" font-size="15" fill="#65717c">CSV · XLSX · PDF</text>

    <text x="440" y="205" font-size="20" font-weight="650" fill="#17202a">Scenario + Mapping</text>
    <text x="440" y="237" font-size="15" fill="#65717c">selectors · aliases · rules</text>

    <text x="710" y="205" font-size="20" font-weight="650" fill="#17202a">Browser Adapter</text>
    <text x="710" y="237" font-size="15" fill="#65717c">Playwright · DOM-first</text>

    <text x="1005" y="205" font-size="20" font-weight="650" fill="#17202a">Enterprise Mock ERP</text>
    <text x="1005" y="237" font-size="15" fill="#65717c">login · pagination · faults</text>
  </g>

  <line x1="280" y1="215" x2="330" y2="215" stroke="#53718a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="215" x2="600" y2="215" stroke="#53718a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="215" x2="870" y2="215" stroke="#53718a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="180" y="390" width="250" height="120" rx="16" fill="#dce9ff"/>
    <rect x="475" y="390" width="250" height="120" rx="16" fill="#e2f5e9"/>
    <rect x="770" y="390" width="250" height="120" rx="16" fill="#fff3dc"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" text-anchor="middle">
    <text x="305" y="438" font-size="20" font-weight="650" fill="#173f7a">Evidence &amp; Recovery</text>
    <text x="305" y="470" font-size="15" fill="#385c87">screenshots · diagnostics</text>
    <text x="305" y="492" font-size="15" fill="#385c87">retry · checkpoint resume</text>

    <text x="600" y="438" font-size="20" font-weight="650" fill="#1d633b">Deterministic Rules</text>
    <text x="600" y="470" font-size="15" fill="#397554">Decimal tolerance · currency</text>
    <text x="600" y="492" font-size="15" fill="#397554">status · missing · duplicate</text>

    <text x="895" y="438" font-size="20" font-weight="650" fill="#7a5200">Auditable Outputs</text>
    <text x="895" y="470" font-size="15" fill="#876516">JSON · HTML · XLSX</text>
    <text x="895" y="492" font-size="15" fill="#876516">filters · evidence links</text>
  </g>

  <path d="M710,270 C710,330 600,330 600,390" fill="none" stroke="#53718a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M440,390 C440,340 330,350 330,390" fill="none" stroke="#53718a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="450" x2="475" y2="450" stroke="#53718a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="725" y1="450" x2="770" y2="450" stroke="#53718a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="575" width="840" height="60" rx="14" fill="#17202a"/>
  <text x="600" y="612" font-family="-apple-system,BlinkMacSystemFont,sans-serif" text-anchor="middle" font-size="18" fill="#ffffff">
    Deterministic decisions · observable execution · reusable adapters
  </text>
</svg>
