name: Invoice Reconciliation Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invoice-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate invoice scenario
        run: |
          python -m opskestrel scenario validate \
            scenarios/invoice_reconciliation/scenario.json

      - name: Run offline reconciliation
        run: |
          mkdir -p reports/ci
          python -m opskestrel reconcile \
            scenarios/invoice_reconciliation/data/input_invoices.csv \
            scenarios/invoice_reconciliation/data/erp_invoices.json \
            --config scenarios/invoice_reconciliation/mapping.json \
            --output reports/ci/invoice-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/ci/invoice-reconciliation.json").read_text()
          )
          summary = report["summary"]
          assert summary["total"] == 20
          assert summary["by_status"]["matched"] == 10
          assert summary["by_status"]["amount_mismatch"] == 2
          assert summary["by_status"]["missing_in_erp"] == 2
          assert summary["by_status"]["duplicate_in_erp"] == 1
          assert summary["by_status"]["invalid_input"] == 3
          PY

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Upload reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: invoice-reconciliation-report
          path: reports/ci/invoice-reconciliation.json
          retention-days: 7
