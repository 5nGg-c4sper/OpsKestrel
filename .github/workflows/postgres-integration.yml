name: PostgreSQL Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soc_agent_test
          POSTGRES_USER: soc_agent
          POSTGRES_PASSWORD: soc_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc_agent -d soc_agent_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      SOC_TEST_POSTGRES_DSN: >-
        postgresql://soc_agent:soc_agent_test@localhost:5432/soc_agent_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-integration.txt

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-integration.txt

      - name: Run PostgreSQL queue integration tests
        run: |
          python -m unittest discover \
            -s tests/integration \
            -p 'test_*.py' \
            -v
