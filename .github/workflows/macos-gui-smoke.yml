name: macOS GUI Smoke

'on':
  workflow_dispatch:
    inputs:
      task:
        description: Safe task to run on the GUI runner
        required: true
        type: choice
        default: tasks/calculator_17x23.json
        options:
          - tasks/calculator_17x23.json
          - tasks/calculator_125_div_5.json
          - tasks/examples/multi_app_activate.json
          - tasks/examples/setup_cleanup.json
      model:
        description: Qwen vision model
        required: true
        type: string
        default: Qwen/Qwen3-VL-8B-Instruct
      upload_reports:
        description: Upload reports and screenshots as a private artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: soc-macos-gui-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gui-smoke:
    name: Manual macOS GUI smoke
    runs-on: [self-hosted, macOS, soc-gui]
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.siliconflow.cn/v1' }}
      MODEL: ${{ inputs.model }}
      SCREENSHOT_SCALE: "0.5"
      ACTION_SETTLE_DELAY: "0.6"
      QWEN_TIMEOUT_SECONDS: "30"
      TASK_PATH: ${{ inputs.task }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci-macos.txt

      - name: Validate GUI runner
        run: |
          set -euo pipefail

          if [ "$(uname -s)" != "Darwin" ]; then
            echo "This workflow requires macOS." >&2
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "Repository secret OPENAI_API_KEY is required." >&2
            exit 1
          fi
          if ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "The runner is not running in a logged-in GUI session." >&2
            exit 1
          fi

          accessibility_enabled="$(
            osascript \
              -e 'tell application "System Events" to return UI elements enabled'
          )"
          if [ "$accessibility_enabled" != "true" ]; then
            echo "Accessibility permission is not enabled for the runner." >&2
            exit 1
          fi

          screenshot_path="$(mktemp -t soc-ci-screen).png"
          trap 'rm -f "$screenshot_path"' EXIT
          screencapture -x "$screenshot_path"
          if [ ! -s "$screenshot_path" ]; then
            echo "Screen Recording permission is not enabled for the runner." >&2
            exit 1
          fi

          if [ ! -f "$TASK_PATH" ]; then
            echo "Task file does not exist: $TASK_PATH" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip
          .venv-ci/bin/python -m pip install -r requirements-ci-macos.txt

      - name: Run unit tests
        run: |
          .venv-ci/bin/python -m unittest discover \
            -s tests/unit \
            -p 'test_*.py' \
            -v

      - name: Run GUI smoke task
        run: |
          .venv-ci/bin/python -m soc_agent run "$TASK_PATH" \
            --non-interactive \
            --reports-dir reports/ci

      - name: Upload GUI reports
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@v4
        with:
          name: soc-macos-gui-reports-${{ github.run_id }}
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7
