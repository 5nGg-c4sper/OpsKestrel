services:
  postgres:
    image: postgres:16-alpine
    container_name: opskestrel-postgres-test
    environment:
      POSTGRES_DB: opskestrel_test
      POSTGRES_USER: opskestrel
      POSTGRES_PASSWORD: opskestrel_test
    ports:
      - "${OPSKESTREL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opskestrel -d opskestrel_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
