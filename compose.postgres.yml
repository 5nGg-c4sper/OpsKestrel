services:
  postgres:
    image: postgres:16-alpine
    container_name: soc-agent-postgres-test
    environment:
      POSTGRES_DB: soc_agent_test
      POSTGRES_USER: soc_agent
      POSTGRES_PASSWORD: soc_agent_test
    ports:
      - "${SOC_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_agent -d soc_agent_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
